<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="description" content="A simple daily English practice app for Korean speakers.">
  <title>Say it — English practice</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="wordmark" href="#home" aria-label="Say it home">say it<span>.</span></a>
      <div class="header-controls">
        <button class="hide-lesson-button" id="hideLessonButton" hidden>Hide</button>
        <button class="header-action" id="headerAction" aria-label="Save lesson" hidden></button>
      </div>
    </header>
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <nav class="tab-bar" aria-label="Main navigation">
      <a href="#home" data-tab="home"><span>⌂</span>Today</a>
      <a href="#browse" data-tab="browse"><span>▦</span>Browse</a>
      <a href="#add" data-tab="add"><span>＋</span>Add</a>
      <a href="#saved" data-tab="saved"><span>♡</span>Saved</a>
      <a href="#archive" data-tab="archive"><span>▤</span>Archive</a>
    </nav>
  </div>
  <script src="assets/app.js" defer></script>
</body>
</html>
